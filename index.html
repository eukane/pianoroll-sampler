<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no: 두 손가락 핀치를 브라우저 확대가 아니라 피아노롤 확대로 쓴다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12141a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312141a'/%3E%3Crect x='5' y='8' width='13' height='5' rx='2' fill='%234ec9b0'/%3E%3Crect x='11' y='15' width='16' height='5' rx='2' fill='%234ec9b0'/%3E%3Crect x='7' y='22' width='10' height='5' rx='2' fill='%234ec9b0'/%3E%3C/svg%3E"
    />
    <title>피아노롤</title>
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <div class="row">
          <button id="rewind" type="button" title="맨 앞으로 (Home)">⏮</button>
          <button id="play" class="primary" type="button">▶︎ 재생</button>
          <button id="loop" type="button">🔁 루프</button>
          <span id="pos" class="pos">1 : 1</span>
          <button id="undo" type="button" title="실행 취소" disabled>↶</button>
          <button id="redo" type="button" title="다시 실행" disabled>↷</button>
          <button id="copy" type="button" title="루프 구간(없으면 이 마디) 복사">⧉ 복사</button>
          <button id="paste" type="button" title="재생 위치에 붙여넣기" disabled>⎘ 붙여넣기</button>
          <span class="spacer"></span>
          <button id="zoom-out" type="button" title="가로 축소">－</button>
          <button id="zoom-in" type="button" title="가로 확대">＋</button>
          <button id="keys-out" type="button" title="세로 축소">▁</button>
          <button id="keys-in" type="button" title="세로 확대">▇</button>
        </div>
        <div class="row">
          <button id="instrument" type="button">🎹 임시 신스</button>
          <button id="load-sf" type="button">📂 음원</button>
          <button id="mixer" type="button">🎚️ 믹서</button>
          <button id="export" type="button">💾 내보내기</button>
          <input id="sf-file" type="file" accept=".sf2,.sf3,.dls" hidden />
          <input id="sample-files" type="file" accept="audio/*,.wav" multiple hidden />
          <span class="spacer"></span>
          <label>BPM <input id="bpm" type="number" min="20" max="300" step="1" value="100" /></label>
          <label>마디 <input id="bars" type="number" min="1" max="64" step="1" value="4" /></label>
          <label>
            스냅
            <select id="snap">
              <option value="1">1/4</option>
              <option value="0.5" selected>1/8</option>
              <option value="0.25">1/16</option>
              <option value="0.3333333333333333">1/8 셋잇단</option>
              <option value="0.16666666666666666">1/16 셋잇단</option>
            </select>
          </label>
          <label>
            소리
            <select id="wave">
              <option value="sawtooth" selected>톱니</option>
              <option value="sine">사인</option>
              <option value="square">사각</option>
              <option value="triangle">삼각</option>
            </select>
          </label>
        </div>
        <div class="row" id="tracks"></div>
      </header>

      <canvas id="roll"></canvas>

      <div id="status" class="hidden"></div>

      <footer id="hint">
        탭=찍기 · 드래그=옮기기 · 오른쪽끝=길이 · 길게=삭제 · 두손가락=확대 · 위눈금=위치/루프
      </footer>
    </div>

    <div id="mixer-modal" class="hidden">
      <div class="sheet">
        <div class="sheet-head">
          <b>믹서</b>
          <button id="mixer-close" type="button">닫기</button>
        </div>
        <div id="mixer-list" class="sheet-body"></div>
      </div>
    </div>

    <div id="export-modal" class="hidden">
      <div class="sheet">
        <div class="sheet-head">
          <b>내보내기 · 가져오기</b>
          <button id="export-close" type="button">닫기</button>
        </div>
        <div class="sheet-body">
          <button id="save-wav" class="big" type="button">
            🎧 WAV 로 내보내기<small>전체 믹스 · 44.1kHz 16bit</small>
          </button>
          <button id="save-stems" class="big" type="button">
            🎚️ 트랙별 WAV<small>트랙마다 따로 — 다른 DAW 에 얹을 때</small>
          </button>
          <button id="save-midi" class="big" type="button">
            🎼 MIDI 로 내보내기<small>SMF 포맷 1 · 트랙당 1채널</small>
          </button>
          <button id="save-json" class="big" type="button">
            💾 프로젝트 저장<small>나중에 이어서 하려면</small>
          </button>
          <hr />
          <button id="open-file" class="big" type="button">
            📂 열기<small>.mid 나 저장해 둔 .json</small>
          </button>
          <input id="import-file" type="file" accept=".mid,.midi,.json" hidden />
          <div id="demo-list"></div>
        </div>
      </div>
    </div>

    <div id="note-modal" class="hidden">
      <div class="sheet">
        <div class="sheet-head">
          <b>음 하나 — <span id="note-title"></span></b>
          <button id="note-close" type="button">닫기</button>
        </div>
        <p class="note">
          같은 음이어도 어떻게 연주하느냐로 느낌이 달라진다. 고르면 바로 들려준다.
        </p>
        <div id="note-body" class="sheet-body"></div>
      </div>
    </div>

    <div id="map-modal" class="hidden">
      <div class="sheet">
        <div class="sheet-head">
          <b>건반 정하기</b>
          <button id="map-close" type="button">닫기</button>
        </div>
        <p class="note" id="map-note"></p>
        <div id="map-list" class="sheet-body"></div>
      </div>
    </div>

    <div id="preset-modal" class="hidden">
      <div class="sheet">
        <div class="sheet-head">
          <input
            id="preset-search"
            type="search"
            placeholder="악기 검색 — sax, piano, guitar…"
            autocomplete="off"
          />
          <button id="preset-close" type="button">닫기</button>
        </div>
        <div id="preset-list"></div>
      </div>
    </div>

    <div id="unlock">
      <div class="card">
        <div class="big">🔊</div>
        <p>화면을 한 번 탭하면 소리가 켜집니다</p>
        <small>폰 브라우저는 사용자가 만지기 전에 소리를 내주지 않습니다</small>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
